<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8eb">
    <meta name="description" content="A gentle matching game for little learners. Find the same object, amount, or color.">
    <title>Find It! — Arcade Lab</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <a class="back-link" href="../index.html" data-i18n="back" data-i18n-aria="backAria" aria-label="Back to Arcade Lab">← Games</a>
            <div class="brand"><span class="brand-mark" aria-hidden="true">✿</span><span data-i18n="brand">FIND IT!</span></div>
            <div class="parent-controls">
                <div class="language-switch" role="group" aria-label="Choose language" data-i18n-aria="language">
                    <button class="language-button is-active" type="button" data-language="en" aria-pressed="true" aria-label="English">EN</button>
                    <button class="language-button" type="button" data-language="ro" aria-pressed="false" aria-label="Română">RO</button>
                </div>
                <button id="repeat-button" class="icon-button repeat-button" type="button" aria-label="Hear the clue again" data-i18n-aria="repeatAria">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 0 1 13.7-5.7L20 7.5M20 4v3.5h-3.5M20 13a8 8 0 0 1-13.7 5.7L4 16.5M4 20v-3.5h3.5"/></svg>
                    <span data-i18n="repeat">Hear it</span>
                </button>
                <button id="voice-button" class="icon-button voice-button" type="button" role="switch" aria-checked="true" aria-label="Voice on">
                    <svg class="voice-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18a5 5 0 0 0 5-5V8a5 5 0 0 0-10 0v5a5 5 0 0 0 5 5Zm-8-5a8 8 0 0 0 16 0m-8 8v-3m-4 3h8"/></svg>
                    <svg class="voice-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18a5 5 0 0 0 5-5V8a5 5 0 0 0-10 0v5a5 5 0 0 0 5 5Zm-8-5a8 8 0 0 0 16 0m-8 8v-3m-4 3h8M4 4l16 16"/></svg>
                    <span data-i18n="voiceOn">Voice on</span>
                </button>
                <button id="sound-button" class="icon-button sound-button" type="button" aria-label="Mute sound" data-i18n-aria="mute" aria-pressed="false">
                    <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Zm12-.5a4 4 0 0 1 0 5m2.5-7.5a7.5 7.5 0 0 1 0 10"/></svg>
                    <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Zm12 1 5 5m0-5-5 5"/></svg>
                </button>
            </div>
        </header>

        <section class="intro" aria-labelledby="page-title">
            <div>
                <p class="eyebrow" data-i18n="eyebrow">Look · listen · tap</p>
                <h1 id="page-title" data-i18n="title">Let's find it!</h1>
            </div>
            <p class="intro-copy" data-i18n="intro">A little look-and-find game made for little learners.</p>
        </section>

        <nav class="mode-picker" aria-label="Choose a game" data-i18n-aria="modeNav">
            <button class="mode-button is-active" type="button" data-mode="object" aria-pressed="true">
                <span class="mode-icon object-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M10 22c-2-9 3-15 10-15s12 6 10 15l-2 8H12l-2-8Z" fill="#f8a66b"/><path d="m13 12-1-8 8 5m7 3 1-8-8 5" fill="#f8a66b" stroke="#c46e49" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="20" r="1.5" fill="#533d37"/><circle cx="24" cy="20" r="1.5" fill="#533d37"/><path d="M18 24q2 2 4 0" fill="none" stroke="#533d37" stroke-width="1.5" stroke-linecap="round"/></svg></span>
                <span data-i18n="modeObject">Find the object</span>
            </button>
            <button class="mode-button" type="button" data-mode="quantity" aria-pressed="false">
                <span class="mode-icon quantity-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M9 25c0-7 5-12 11-12s11 5 11 12v7H9v-7Z" fill="#ef7a69"/><path d="M20 13c0-5 3-7 7-7" fill="none" stroke="#598c54" stroke-width="3" stroke-linecap="round"/><path d="M24 7c4-3 8-1 8 3-4 2-7 1-8-3Z" fill="#81ae66"/><path d="M13 25q2-3 4 0m6 0q2-3 4 0" fill="none" stroke="#ffd7a5" stroke-width="2"/></svg></span>
                <span data-i18n="modeQuantity">Match the amount</span>
            </button>
            <button class="mode-button" type="button" data-mode="color" aria-pressed="false">
                <span class="mode-icon color-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 5a15 15 0 1 0 0 30h3a4 4 0 0 0 3-7c-1-2 0-4 3-4 4 0 6-3 6-7C35 11 28 5 20 5Z" fill="#f5cb57"/><circle cx="13" cy="15" r="2.4" fill="#ef7770"/><circle cx="22" cy="11" r="2.4" fill="#76b9de"/><circle cx="29" cy="17" r="2.4" fill="#81b879"/><circle cx="14" cy="24" r="2.4" fill="#bd8fc7"/></svg></span>
                <span data-i18n="modeColor">Find the color</span>
            </button>
        </nav>

        <div class="session-counters" role="group" aria-label="Session answers" data-i18n-aria="sessionAnswers">
            <div class="session-counter correct-counter">
                <span class="counter-icon" aria-hidden="true">✓</span>
                <span data-i18n="correctAnswers">Correct</span>
                <strong id="correct-count">0</strong>
            </div>
            <div class="session-counter retry-counter">
                <span class="counter-icon" aria-hidden="true">↻</span>
                <span data-i18n="wrongAnswers">Try again</span>
                <strong id="wrong-count">0</strong>
            </div>
        </div>

        <section class="game-panel" aria-label="Find It game" data-i18n-aria="gameLabel">
            <div class="target-area">
                <div class="target-heading">
                    <span class="target-caption" data-i18n="targetPrompt">Can you find...</span>
                    <span class="sparkle" aria-hidden="true">✦</span>
                </div>
                <div id="target" class="target-display" aria-live="polite"></div>
            </div>
            <div id="feedback" class="feedback" aria-live="polite">Choose the one that looks the same!</div>
            <div id="choices" class="choices" role="group" aria-label="Nine choices" data-i18n-aria="choicesLabel"></div>
        </section>
        <footer class="page-footer"><span>ARCADE LAB</span><span data-i18n="footer">One little find at a time</span></footer>
    </main>
    <script src="./src/data.js"></script>
    <script src="./src/rounds.js"></script>
    <script src="./src/art.js"></script>
    <script src="./src/languages.js"></script>
    <script src="./src/main.js"></script>
</body>
</html>
