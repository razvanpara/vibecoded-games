<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d16">
    <meta name="description" content="Swap colorful gems, clear cascades, and beat your best score.">
    <title>Match / Swap — Arcade Lab</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #090d16;
            color: #f8fafc;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; margin: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 12% 8%, rgba(99,102,241,.18), transparent 38rem),
                radial-gradient(ellipse at 90% 90%, rgba(56,189,248,.12), transparent 34rem),
                #090d16;
        }
        body::before {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
            background-size: 42px 42px;
            content: "";
            pointer-events: none;
        }
        .game-shell { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; }
        .topbar { display: flex; height: 34px; align-items: center; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 11px;
            border: 1px solid rgba(148,163,184,.2);
            border-radius: 8px;
            background: rgba(30,41,59,.8);
            color: #e2e8f0;
            font-size: .85rem;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link:hover, .back-link:focus-visible { border-color: rgba(129,140,248,.5); background: rgba(99,102,241,.16); color: #c4b5fd; outline: none; }
        canvas { display: block; width: 100%; height: auto; outline: none; touch-action: none; user-select: none; }
        @media (pointer: coarse), (max-width: 700px) {
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                min-height: 100svh;
                padding-block: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-bottom));
            }
            .topbar { height: 42px; }
            .back-link { min-height: 40px; padding: 9px 12px; }
        }
    </style>
</head>
<body>
    <main class="game-shell">
        <header class="topbar"><a class="back-link" href="../index.html">← Games</a></header>
        <canvas id="game" width="760" height="520" tabindex="0" aria-label="Match Swap. Move with arrow keys or WASD, press Space to select and swap, Escape to cancel, and R to restart."></canvas>
    </main>
    <script>
    (() => {
        "use strict";

        const COLS = 8;
        const ROWS = 8;
        const CELL_SIZE = 56;
        const COLORS = Object.freeze(["#fb7185", "#38bdf8", "#fbbf24", "#a78bfa", "#34d399", "#fb923c"]);
        const SWAP_DURATION = 150;
        const CLEAR_DURATION = 200;
        const FALL_SPEED = 400;
        const REJECT_DURATION = 220;
        const POINTS_PER_CIRCLE = 10;
        const FOUR_MATCH_BONUS = 20;
        const FIVE_PLUS_MATCH_BONUS = 50;
        const POINTS_POPUP_DURATION = 1000;
        const NOTICE_DURATION = 1200;
        const STORAGE_KEY = "matchSwapBestScore";
        const KEY = Object.freeze({
            UP: ["ArrowUp", "w"], LEFT: ["ArrowLeft", "a"],
            DOWN: ["ArrowDown", "s"], RIGHT: ["ArrowRight", "d"],
            SELECT: " ", CANCEL: "Escape", RESTART: "r"
        });
        const DESKTOP_LAYOUT = Object.freeze({ width: 760, height: 520, boardX: 24, boardY: 36 });
        const PORTRAIT_LAYOUT = Object.freeze({ width: 520, height: 760, boardX: 36, boardY: 34 });
        const BOARD_WIDTH = COLS * CELL_SIZE;
        const BOARD_HEIGHT = ROWS * CELL_SIZE;
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let layout = DESKTOP_LAYOUT;
        let boardX = layout.boardX;
        let boardY = layout.boardY;
        let board = [];
        let cursor = { x: 3, y: 3 };
        let selected = null;
        let score = 0;
        let bestScore = readBestScore();
        let phase = "idle";
        let phaseElapsed = 0;
        let moveAnimation = null;
        let clearAnimation = null;
        let dropAnimations = [];
        let cascadeMultiplier = 0;
        let rejectCell = null;
        let popupPoints = 0;
        let popupElapsed = POINTS_POPUP_DURATION;
        let notice = "";
        let noticeElapsed = NOTICE_DURATION;
        let lastFrameTime = 0;
        let pointerStart = null;

        function readBestScore() {
            try {
                return Number(localStorage.getItem(STORAGE_KEY)) || 0;
            } catch (error) {
                console.warn("Unable to read the saved best score.", error);
                return 0;
            }
        }

        function saveBestScore() {
            if (score <= bestScore) return;
            bestScore = score;
            try {
                localStorage.setItem(STORAGE_KEY, String(bestScore));
            } catch (error) {
                console.warn("Unable to save the best score.", error);
            }
        }

        function resizeCanvas() {
            const isPortrait = window.innerWidth < 760;
            layout = isPortrait ? PORTRAIT_LAYOUT : DESKTOP_LAYOUT;
            canvas.width = layout.width;
            canvas.height = layout.height;
            boardX = layout.boardX;
            boardY = layout.boardY;

            const topbarHeight = window.matchMedia("(pointer: coarse), (max-width: 700px)").matches ? 42 : 34;
            const availableWidth = Math.max(1, window.innerWidth - 32);
            const availableHeight = Math.max(1, window.innerHeight - topbarHeight - 24);
            const scale = Math.min(availableWidth / layout.width, availableHeight / layout.height, 1.15);
            canvas.style.width = `${layout.width * scale}px`;
            canvas.style.height = `${layout.height * scale}px`;
            document.querySelector(".game-shell").style.width = `${layout.width * scale}px`;
            render();
        }

        function randomColor() {
            return Math.floor(Math.random() * COLORS.length);
        }

        function matchesAtCell(x, y, color) {
            let count = 1;
            for (let step = 1; step < 3 && x - step >= 0 && board[y][x - step] === color; step++) count++;
            for (let step = 1; step < 3 && x + step < COLS && board[y][x + step] === color; step++) count++;
            if (count >= 3) return true;
            count = 1;
            for (let step = 1; step < 3 && y - step >= 0 && board[y - step][x] === color; step++) count++;
            for (let step = 1; step < 3 && y + step < ROWS && board[y + step][x] === color; step++) count++;
            return count >= 3;
        }

        function randomColorWithoutMatch(x, y) {
            const choices = COLORS.map((_, index) => index);
            for (let i = choices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [choices[i], choices[j]] = [choices[j], choices[i]];
            }
            for (const color of choices) {
                board[y][x] = color;
                if (!matchesAtCell(x, y, color)) return color;
            }
            throw new Error(`Unable to refill cell ${x}, ${y} without creating a match.`);
        }

        function newBoard() {
            do {
                board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) randomColorWithoutMatch(x, y);
                }
            } while (!hasValidMove());
        }

        function coordinatesEqual(a, b) {
            return a.x === b.x && a.y === b.y;
        }

        function findMatches(targets = null) {
            const lines = [];
            const isTargeted = cells => !targets || cells.some(cell => targets.some(target => coordinatesEqual(cell, target)));

            for (let y = 0; y < ROWS; y++) {
                let start = 0;
                while (start < COLS) {
                    const color = board[y][start];
                    let end = start + 1;
                    while (color !== null && end < COLS && board[y][end] === color) end++;
                    if (color !== null && end - start >= 3) {
                        const cells = Array.from({ length: end - start }, (_, offset) => ({ x: start + offset, y }));
                        if (isTargeted(cells)) lines.push(cells);
                    }
                    start = end;
                }
            }
            for (let x = 0; x < COLS; x++) {
                let start = 0;
                while (start < ROWS) {
                    const color = board[start][x];
                    let end = start + 1;
                    while (color !== null && end < ROWS && board[end][x] === color) end++;
                    if (color !== null && end - start >= 3) {
                        const cells = Array.from({ length: end - start }, (_, offset) => ({ x, y: start + offset }));
                        if (isTargeted(cells)) lines.push(cells);
                    }
                    start = end;
                }
            }

            const uniqueCells = new Map();
            for (const line of lines) {
                for (const cell of line) uniqueCells.set(`${cell.x},${cell.y}`, cell);
            }
            return { lines, cells: [...uniqueCells.values()] };
        }

        function hasValidMove() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    for (const [dx, dy] of [[1, 0], [0, 1]]) {
                        const nx = x + dx;
                        const ny = y + dy;
                        if (nx >= COLS || ny >= ROWS || board[y][x] === board[ny][nx]) continue;
                        [board[y][x], board[ny][nx]] = [board[ny][nx], board[y][x]];
                        const hasMatch = findMatches([{ x, y }, { x: nx, y: ny }]).cells.length > 0;
                        [board[y][x], board[ny][nx]] = [board[ny][nx], board[y][x]];
                        if (hasMatch) return true;
                    }
                }
            }
            return false;
        }

        function setPhase(nextPhase) {
            phase = nextPhase;
            phaseElapsed = 0;
        }

        function startSwap(target) {
            const origin = { ...selected };
            if (board[origin.y][origin.x] === board[target.y][target.x]) {
                rejectCell = target;
                setPhase("reject");
                return;
            }

            const colors = [board[origin.y][origin.x], board[target.y][target.x]];
            [board[origin.y][origin.x], board[target.y][target.x]] = [board[target.y][target.x], board[origin.y][origin.x]];
            moveAnimation = {
                a: origin,
                b: target,
                pieces: [
                    { color: colors[0], from: origin, to: target },
                    { color: colors[1], from: target, to: origin }
                ]
            };
            setPhase("swap");
        }

        function startSwapBack() {
            const { a, b, pieces } = moveAnimation;
            [board[a.y][a.x], board[b.y][b.x]] = [board[b.y][b.x], board[a.y][a.x]];
            moveAnimation = {
                a, b,
                pieces: [
                    { color: pieces[0].color, from: b, to: a },
                    { color: pieces[1].color, from: a, to: b }
                ]
            };
            setPhase("swapBack");
        }

        function resolveMatches(matches, multiplier) {
            cascadeMultiplier = multiplier;
            clearAnimation = matches.cells.map(cell => ({ ...cell, color: board[cell.y][cell.x] }));
            for (const cell of matches.cells) board[cell.y][cell.x] = null;

            let points = matches.cells.length * POINTS_PER_CIRCLE;
            for (const line of matches.lines) {
                if (line.length === 4) points += FOUR_MATCH_BONUS;
                else if (line.length >= 5) points += FIVE_PLUS_MATCH_BONUS;
            }
            points *= multiplier;
            score += points;
            saveBestScore();
            popupPoints = points;
            popupElapsed = 0;
            setPhase("clear");
        }

        function finishSwap() {
            const matches = findMatches([moveAnimation.a, moveAnimation.b]);
            if (matches.cells.length === 0) {
                startSwapBack();
                return;
            }
            cursor = { ...moveAnimation.b };
            selected = null;
            resolveMatches(matches, 1);
        }

        function applyGravityAndRefill() {
            dropAnimations = [];
            for (let x = 0; x < COLS; x++) {
                const survivors = [];
                for (let y = ROWS - 1; y >= 0; y--) {
                    if (board[y][x] !== null) survivors.push({ color: board[y][x], fromY: y });
                }
                const emptyCount = ROWS - survivors.length;
                for (let index = 0; index < survivors.length; index++) {
                    const targetY = ROWS - 1 - index;
                    const piece = survivors[index];
                    board[targetY][x] = piece.color;
                    if (piece.fromY !== targetY) {
                        dropAnimations.push({ x, color: piece.color, fromY: piece.fromY, targetY });
                    }
                }
                for (let y = 0; y < emptyCount; y++) board[y][x] = null;
                for (let y = 0; y < emptyCount; y++) {
                    const color = randomColorWithoutMatch(x, y);
                    dropAnimations.push({ x, color, fromY: y - emptyCount, targetY: y });
                }
            }
            setPhase("drop");
        }

        function finishTurn() {
            cascadeMultiplier = 0;
            if (!hasValidMove()) {
                newBoard();
                notice = "NO MOVES — SHUFFLING";
                noticeElapsed = 0;
            }
        }

        function beginRestart() {
            score = 0;
            selected = null;
            cursor = { x: 3, y: 3 };
            cascadeMultiplier = 0;
            moveAnimation = null;
            clearAnimation = null;
            dropAnimations = [];
            rejectCell = null;
            popupPoints = 0;
            popupElapsed = POINTS_POPUP_DURATION;
            notice = "";
            noticeElapsed = NOTICE_DURATION;
            setPhase("idle");
            newBoard();
        }

        function handleDirection(dx, dy) {
            if (selected) {
                const x = selected.x + dx;
                const y = selected.y + dy;
                if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
                startSwap({ x, y });
                return;
            }
            cursor = {
                x: Math.max(0, Math.min(COLS - 1, cursor.x + dx)),
                y: Math.max(0, Math.min(ROWS - 1, cursor.y + dy))
            };
        }

        function keyDown(event) {
            const key = event.key;
            if (key === " " || key.startsWith("Arrow")) event.preventDefault();
            const lowerKey = key.toLowerCase();
            if (phase !== "idle") return;

            if (lowerKey === KEY.RESTART) {
                beginRestart();
                return;
            }
            if (key === KEY.CANCEL) {
                selected = null;
                return;
            }
            if (key === KEY.SELECT) {
                if (selected) selected = null;
                else selected = { ...cursor };
                return;
            }
            if (KEY.UP.includes(key) || KEY.UP.includes(lowerKey)) handleDirection(0, -1);
            else if (KEY.LEFT.includes(key) || KEY.LEFT.includes(lowerKey)) handleDirection(-1, 0);
            else if (KEY.DOWN.includes(key) || KEY.DOWN.includes(lowerKey)) handleDirection(0, 1);
            else if (KEY.RIGHT.includes(key) || KEY.RIGHT.includes(lowerKey)) handleDirection(1, 0);
        }

        function cellAtPointer(event) {
            const rect = canvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) * canvas.width / rect.width;
            const y = (event.clientY - rect.top) * canvas.height / rect.height;
            const cell = {
                x: Math.floor((x - boardX) / CELL_SIZE),
                y: Math.floor((y - boardY) / CELL_SIZE)
            };
            if (cell.x < 0 || cell.x >= COLS || cell.y < 0 || cell.y >= ROWS) return null;
            return cell;
        }

        function handleBoardTap(cell) {
            if (!selected) {
                selected = { ...cell };
                cursor = { ...cell };
            } else if (coordinatesEqual(selected, cell)) {
                selected = null;
            } else if (Math.abs(selected.x - cell.x) + Math.abs(selected.y - cell.y) === 1) {
                cursor = { ...cell };
                startSwap(cell);
            } else {
                selected = { ...cell };
                cursor = { ...cell };
            }
        }

        function pointerDown(event) {
            event.preventDefault();
            canvas.focus({ preventScroll: true });
            if (phase !== "idle") return;
            const cell = cellAtPointer(event);
            if (!cell) return;
            pointerStart = { cell, x: event.clientX, y: event.clientY, pointerId: event.pointerId };
            canvas.setPointerCapture(event.pointerId);
        }

        function pointerUp(event) {
            if (!pointerStart || pointerStart.pointerId !== event.pointerId) return;
            event.preventDefault();
            const start = pointerStart;
            pointerStart = null;
            if (phase !== "idle") return;

            const rect = canvas.getBoundingClientRect();
            const dx = (event.clientX - start.x) * canvas.width / rect.width;
            const dy = (event.clientY - start.y) * canvas.height / rect.height;
            const threshold = CELL_SIZE * .22;
            if (Math.max(Math.abs(dx), Math.abs(dy)) >= threshold) {
                const [stepX, stepY] = Math.abs(dx) > Math.abs(dy)
                    ? [Math.sign(dx), 0]
                    : [0, Math.sign(dy)];
                const target = { x: start.cell.x + stepX, y: start.cell.y + stepY };
                cursor = { ...start.cell };
                selected = { ...start.cell };
                if (target.x >= 0 && target.x < COLS && target.y >= 0 && target.y < ROWS) {
                    startSwap(target);
                }
                return;
            }

            const cell = cellAtPointer(event);
            if (cell) handleBoardTap(cell);
        }

        function drawCircle(colorIndex, x, y, radius = CELL_SIZE * .37, shake = 0) {
            if (colorIndex === null || radius <= .5) return;
            const centerX = boardX + x * CELL_SIZE + CELL_SIZE / 2 + shake;
            const centerY = boardY + y * CELL_SIZE + CELL_SIZE / 2;
            const color = COLORS[colorIndex];
            ctx.save();
            ctx.shadowColor = color;
            ctx.shadowBlur = 11;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(centerX, centerY, Math.max(0, radius), 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            const highlight = ctx.createRadialGradient(centerX - radius * .35, centerY - radius * .42, radius * .04, centerX, centerY, radius);
            highlight.addColorStop(0, "rgba(255,255,255,.65)");
            highlight.addColorStop(.35, "rgba(255,255,255,.12)");
            highlight.addColorStop(1, "rgba(0,0,0,.22)");
            ctx.fillStyle = highlight;
            ctx.beginPath();
            ctx.arc(centerX, centerY, Math.max(0, radius), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawBoard() {
            ctx.fillStyle = "#0b1220";
            ctx.fillRect(boardX, boardY, BOARD_WIDTH, BOARD_HEIGHT);
            const hiddenCells = new Set();
            if (phase === "swap" || phase === "swapBack") {
                hiddenCells.add(`${moveAnimation.a.x},${moveAnimation.a.y}`);
                hiddenCells.add(`${moveAnimation.b.x},${moveAnimation.b.y}`);
            }
            if (phase === "clear") {
                for (const cell of clearAnimation) hiddenCells.add(`${cell.x},${cell.y}`);
            }
            if (phase === "drop") {
                for (const piece of dropAnimations) hiddenCells.add(`${piece.x},${piece.targetY}`);
            }
            if (phase === "reject" && rejectCell) hiddenCells.add(`${rejectCell.x},${rejectCell.y}`);

            for (let y = 0; y <= ROWS; y++) {
                ctx.strokeStyle = "rgba(148,163,184,.13)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(boardX, boardY + y * CELL_SIZE + .5);
                ctx.lineTo(boardX + BOARD_WIDTH, boardY + y * CELL_SIZE + .5);
                ctx.stroke();
            }
            for (let x = 0; x <= COLS; x++) {
                ctx.strokeStyle = "rgba(148,163,184,.13)";
                ctx.beginPath();
                ctx.moveTo(boardX + x * CELL_SIZE + .5, boardY);
                ctx.lineTo(boardX + x * CELL_SIZE + .5, boardY + BOARD_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (!hiddenCells.has(`${x},${y}`)) drawCircle(board[y][x], x, y);
                }
            }
        }

        function drawMovingPieces() {
            if (phase === "swap" || phase === "swapBack") {
                const progress = Math.min(1, phaseElapsed / SWAP_DURATION);
                for (const piece of moveAnimation.pieces) {
                    const x = piece.from.x + (piece.to.x - piece.from.x) * progress;
                    const y = piece.from.y + (piece.to.y - piece.from.y) * progress;
                    drawCircle(piece.color, x, y);
                }
            } else if (phase === "clear") {
                const progress = Math.min(1, phaseElapsed / CLEAR_DURATION);
                for (const cell of clearAnimation) drawCircle(cell.color, cell.x, cell.y, CELL_SIZE * .37 * (1 - progress));
            } else if (phase === "drop") {
                for (const piece of dropAnimations) {
                    const duration = Math.max(1, Math.abs(piece.targetY - piece.fromY) * CELL_SIZE * 1000 / FALL_SPEED);
                    const progress = Math.min(1, phaseElapsed / duration);
                    const y = piece.fromY + (piece.targetY - piece.fromY) * progress;
                    drawCircle(piece.color, piece.x, y);
                }
            }
        }

        function roundedPanel(x, y, width, height) {
            ctx.fillStyle = "rgba(20,28,45,.86)";
            ctx.strokeStyle = "rgba(148,163,184,.2)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, 13);
            ctx.fill();
            ctx.stroke();
        }

        function panelText(label, value, x, y) {
            ctx.fillStyle = "#94a3b8";
            ctx.font = "11px ui-monospace, SFMono-Regular, Consolas, monospace";
            ctx.fillText(label, x, y);
            ctx.fillStyle = "#f8fafc";
            ctx.font = "700 24px system-ui, sans-serif";
            ctx.fillText(String(value), x, y + 29);
        }

        function drawPanel() {
            if (layout === DESKTOP_LAYOUT) {
                const x = 510;
                const y = 36;
                roundedPanel(x, y, 224, 448);
                ctx.fillStyle = "#a5b4fc";
                ctx.font = "800 19px system-ui, sans-serif";
                ctx.fillText("MATCH / SWAP", x + 18, y + 33);
                if (popupPoints && popupElapsed < POINTS_POPUP_DURATION) {
                    const alpha = 1 - popupElapsed / POINTS_POPUP_DURATION;
                    ctx.fillStyle = `rgba(52,211,153,${alpha})`;
                    ctx.font = "700 14px system-ui, sans-serif";
                    ctx.fillText(`+${popupPoints}`, x + 18, y + 59 - popupElapsed * .018);
                }
                panelText("SCORE", score, x + 18, y + 112);
                panelText("BEST", bestScore, x + 18, y + 195);
                ctx.fillStyle = "#94a3b8";
                ctx.font = "11px ui-monospace, SFMono-Regular, Consolas, monospace";
                ctx.fillText("WASD / ARROWS  MOVE", x + 18, y + 294);
                ctx.fillText("SPACE  SELECT / SWAP", x + 18, y + 318);
                ctx.fillText("TAP / SWIPE  SELECT / SWAP", x + 18, y + 390);
                ctx.fillText("ESC  CANCEL", x + 18, y + 342);
                ctx.fillText("R  RESTART", x + 18, y + 366);
                ctx.fillStyle = "#64748b";
                ctx.fillText("MATCH 3+ COLORS", x + 18, y + 424);
            } else {
                const x = 26;
                const y = 516;
                roundedPanel(x, y, 468, 210);
                ctx.fillStyle = "#a5b4fc";
                ctx.font = "800 19px system-ui, sans-serif";
                ctx.fillText("MATCH / SWAP", x + 16, y + 31);
                panelText("SCORE", score, x + 16, y + 63);
                panelText("BEST", bestScore, x + 248, y + 63);
                if (popupPoints && popupElapsed < POINTS_POPUP_DURATION) {
                    const alpha = 1 - popupElapsed / POINTS_POPUP_DURATION;
                    ctx.fillStyle = `rgba(52,211,153,${alpha})`;
                    ctx.font = "700 13px system-ui, sans-serif";
                    ctx.fillText(`+${popupPoints}`, x + 118, y + 61 - popupElapsed * .012);
                }
                ctx.fillStyle = "#94a3b8";
                ctx.font = "11px ui-monospace, SFMono-Regular, Consolas, monospace";
                ctx.fillText("TAP TO SELECT  ·  SWIPE A GEM TO SWAP", x + 16, y + 159);
                ctx.fillText("ESC CANCEL   ·   R RESTART", x + 16, y + 183);
            }
        }

        function drawSelections() {
            const pulse = .5 + .5 * Math.sin(performance.now() / 180);
            if (selected) {
                const x = boardX + selected.x * CELL_SIZE + 4;
                const y = boardY + selected.y * CELL_SIZE + 4;
                ctx.strokeStyle = `rgba(52,211,153,${.72 + pulse * .28})`;
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, CELL_SIZE - 8, CELL_SIZE - 8);
            }
            const cursorX = boardX + cursor.x * CELL_SIZE + 2;
            const cursorY = boardY + cursor.y * CELL_SIZE + 2;
            ctx.strokeStyle = selected ? "#f8fafc" : "#fde68a";
            ctx.lineWidth = 2;
            ctx.strokeRect(cursorX, cursorY, CELL_SIZE - 4, CELL_SIZE - 4);

            if (phase === "reject" && rejectCell) {
                const offset = Math.sin(phaseElapsed / REJECT_DURATION * Math.PI * 7) * 4 * (1 - phaseElapsed / REJECT_DURATION);
                const x = boardX + rejectCell.x * CELL_SIZE + 3;
                const y = boardY + rejectCell.y * CELL_SIZE + 3;
                ctx.strokeStyle = "#fb7185";
                ctx.lineWidth = 3;
                ctx.strokeRect(x + offset, y, CELL_SIZE - 6, CELL_SIZE - 6);
                drawCircle(board[rejectCell.y][rejectCell.x], rejectCell.x, rejectCell.y, CELL_SIZE * .37, offset);
            }
        }

        function drawNotice() {
            if (noticeElapsed >= NOTICE_DURATION) return;
            const alpha = Math.min(1, (NOTICE_DURATION - noticeElapsed) / 250);
            ctx.textAlign = "center";
            ctx.fillStyle = `rgba(253,230,138,${alpha})`;
            ctx.font = "700 13px ui-monospace, SFMono-Regular, Consolas, monospace";
            ctx.fillText(notice, boardX + BOARD_WIDTH / 2, boardY + BOARD_HEIGHT + 22);
            ctx.textAlign = "left";
        }

        function render() {
            ctx.fillStyle = "#090d16";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawBoard();
            drawMovingPieces();
            drawSelections();
            drawPanel();
            drawNotice();
        }

        function update(delta) {
            phaseElapsed += delta;
            popupElapsed += delta;
            noticeElapsed += delta;

            if (phase === "swap" && phaseElapsed >= SWAP_DURATION) finishSwap();
            else if (phase === "swapBack" && phaseElapsed >= SWAP_DURATION) {
                moveAnimation = null;
                setPhase("idle");
            } else if (phase === "clear" && phaseElapsed >= CLEAR_DURATION) applyGravityAndRefill();
            else if (phase === "drop") {
                const duration = dropAnimations.reduce((max, piece) =>
                    Math.max(max, Math.abs(piece.targetY - piece.fromY) * CELL_SIZE * 1000 / FALL_SPEED), 0);
                if (phaseElapsed >= duration) {
                    dropAnimations = [];
                    const matches = findMatches();
                    if (matches.cells.length) resolveMatches(matches, cascadeMultiplier + 1);
                    else {
                        setPhase("idle");
                        finishTurn();
                    }
                }
            } else if (phase === "reject" && phaseElapsed >= REJECT_DURATION) {
                rejectCell = null;
                setPhase("idle");
            }
        }

        function frame(now) {
            if (!lastFrameTime) lastFrameTime = now;
            const delta = Math.min(now - lastFrameTime, 100);
            lastFrameTime = now;
            update(delta);
            render();
            requestAnimationFrame(frame);
        }

        newBoard();
        document.addEventListener("keydown", keyDown);
        window.addEventListener("resize", resizeCanvas);
        canvas.addEventListener("pointerdown", pointerDown);
        canvas.addEventListener("pointerup", pointerUp);
        canvas.addEventListener("pointercancel", () => { pointerStart = null; });
        resizeCanvas();
        canvas.focus({ preventScroll: true });
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
